<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Attack Practice Quiz | CyberSafe Academy</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <h1>Phishing Attack Practice Quiz</h1>
  <p>Test your ability to recognize common phishing warning signs.</p>
</header>

<main>
  <section class="quiz-container">
    <p id="progress">Question 1 of 6</p>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="feedback"></p>

    <button id="next-btn" type="button" style="display:none;">
      Next Question
    </button>

    <div id="result" style="display:none;">
      <h2>Quiz Complete!</h2>
      <p id="score"></p>
      <p id="result-message"></p>

      <button id="restart-btn" type="button">
        Restart Quiz
      </button>
    </div>
  </section>

  <p>
    <a href="../phishing-attack-beginners-guide.html">
      ← Back to the Phishing Guide
    </a>
  </p>
</main>

<script src="../js/phishing-attack-beginners-guide.js"></script>

</body>
</html>
