<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Practice identifying social engineering techniques and learn how to respond safely to manipulation attempts.">
  <title>Social Engineering Practice | CyberSafe Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header>
    <h1>Social Engineering Practice</h1>
    <p>Can you recognize manipulation and pressure tactics?</p>
  </header>

  <main>
    <section id="quiz-container">
      <p id="progress"></p>
      <h2 id="question"></h2>

      <div id="answers"></div>

      <p id="feedback"></p>

      <button id="next-btn" type="button" hidden>
        Next Question
      </button>
    </section>

    <section id="result" hidden>
      <h2>Practice Complete</h2>
      <p id="score"></p>
      <p id="result-message"></p>

      <button id="restart-btn" type="button">
        Try Again
      </button>

      <p>
        <a href="../social-engineering.html">
          ← Back to Social Engineering Lesson
        </a>
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CyberSafe Academy</p>
    <p>Educational Cybersecurity Resources</p>
  </footer>

  <script src="../js/social-engineering.js"></script>
</body>
</html>
