<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Scams Awareness Quiz | CyberSafe Academy</title>
  <link rel="stylesheet" href="../css/guides.css">
</head>
<body>

<header>
  <h1>Online Scams Awareness Quiz</h1>
  <p>Test your knowledge of common online scam warning signs.</p>
</header>

<main>
  <section class="quiz-container">
    <p id="progress"></p>
    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="feedback"></p>

    <button id="next-btn" type="button" onclick="showNextQuestion()">Next Question</button>

    <div id="result" style="display: none;">
      <h2>Quiz Complete!</h2>
      <p>Your score: <strong id="score"></strong>/6</p>
      <p id="result-message"></p>
      <button id="restart-btn" type="button" onclick="restartQuiz()">Try Again</button>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2026 CyberSafe Academy</p>
  <p>Educational Cybersecurity Resources</p>
</footer>

<script src="../js/online-scams-awareness-guide.js"></script>
</body>
</html>
